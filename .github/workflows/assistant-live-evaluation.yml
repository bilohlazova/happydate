name: HappyDate Assistant live evaluation

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-live-evaluation
  cancel-in-progress: false

jobs:
  evaluate-conversation-brain:
    name: Synthetic and optional live Conversation Brain baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      OPENAI_API_KEY: ${{ secrets.HAPPYDATE_ASSISTANT_EVAL_OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate synthetic scenarios
        run: npm run eval:assistant

      - name: Record synthetic dataset validation PASS
        if: success()
        run: |
          echo "### Synthetic dataset validation: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "The versioned dataset and evaluator contract passed; no model responses were generated." >> "$GITHUB_STEP_SUMMARY"

      - name: Record real OpenAI evaluation SKIPPED
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "### Real OpenAI evaluation: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped because HAPPYDATE_ASSISTANT_EVAL_OPENAI_API_KEY is not configured; no paid calls were made." >> "$GITHUB_STEP_SUMMARY"

      - name: Run real OpenAI evaluation (paid)
        if: env.OPENAI_API_KEY != ''
        shell: bash
        run: |
          set -o pipefail
          npm run eval:assistant:live | tee assistant-live-evaluation.txt

      - name: Record real OpenAI evaluation PASS
        if: success() && env.OPENAI_API_KEY != ''
        run: |
          echo "### Real OpenAI evaluation: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "The paid synthetic evaluation completed successfully; response content is not uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload content-free evaluation result
        if: always() && env.OPENAI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: assistant-live-evaluation-${{ github.run_id }}
          path: assistant-live-evaluation.txt
          if-no-files-found: error
          retention-days: 30
