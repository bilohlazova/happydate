name: HappyDate Media Lifecycle exact SHA smoke
on:
  push:
    branches: [codex/media-smoke-72b341b]
    paths: [.github/workflows/media-lifecycle-smoke.yml, smoke/media/**, smoke/notes/**]
permissions:
  contents: read
concurrency:
  group: happydate-media-staging
  cancel-in-progress: false
jobs:
  browser-smoke:
    if: ${{ !contains(github.event.head_commit.message, '(notes)') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: happydate-media-staging
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      HAPPYDATE_LOCAL_EXECUTION: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://xgelazzdgluuenqkymox.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qwo_FImiLzCpE9f-iGYzrQ_0m4pntJk
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1caee102e9542a28dc8d0a5813775b07af54a2e2
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert exact application SHA and Staging configuration
        run: |
          test "$(git -C app rev-parse HEAD)" = 1caee102e9542a28dc8d0a5813775b07af54a2e2
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - name: Install app and isolated pinned Playwright harness
        run: |
          cd app
          npm ci
          cd ../harness/smoke/media
          npm init -y
          npm install --save-exact @playwright/test@1.56.1 @supabase/supabase-js@2.112.0
          npx playwright install --with-deps chromium
      - name: Probe exact-SHA Preview without changing protection
        run: |
          code=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' 'https://happydate-9wmaypyb5-bilohlazovamari-gmailcoms-projects.vercel.app/profile')
          echo "Exact-SHA deployed Preview unauthenticated HTTP: $code" >> "$GITHUB_STEP_SUMMARY"
          echo "Using the unchanged local Linux build with Staging; no deployment protection or bypass is modified." >> "$GITHUB_STEP_SUMMARY"
      - name: Build unchanged exact SHA (no full CI)
        working-directory: app
        run: npm run build -- --webpack
      - name: Create temporary Staging fixtures
        working-directory: harness/smoke/media
        env:
          HAPPYDATE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.HAPPYDATE_STAGING_SERVICE_ROLE_KEY }}
        run: node setup.mjs
      - name: Chromium browser lifecycle smoke against local Linux build + Staging
        working-directory: harness/smoke/media
        env:
          HAPPYDATE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.HAPPYDATE_STAGING_SERVICE_ROLE_KEY }}
        run: |
          cd ../../../app
          env -u HAPPYDATE_STAGING_SERVICE_ROLE_KEY npm start > "$RUNNER_TEMP/happydate-next.log" 2>&1 &
          cd ../harness/smoke/media
          npx playwright test media.spec.mjs --workers=1 --reporter=line
      - name: Always remove and verify all run-owned Staging fixtures
        if: ${{ always() }}
        working-directory: harness/smoke/media
        env:
          HAPPYDATE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.HAPPYDATE_STAGING_SERVICE_ROLE_KEY }}
        run: |
          if test -f "$RUNNER_TEMP/happydate-media-state.json"; then node cleanup.mjs; fi
      - name: Retain synthetic browser evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: media-smoke-browser-evidence
          path: harness/smoke/media/evidence/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Record test scope
        if: ${{ always() }}
        run: |
          echo 'Application: 1caee102e9542a28dc8d0a5813775b07af54a2e2; Chromium on Linux; local optimized build with HappyDate Staging. This does not verify a deployed Vercel Preview, its routing or Deployment Protection. No Production credentials or bypass used.' >> "$GITHUB_STEP_SUMMARY"

  notes-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: happydate-media-staging
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      HAPPYDATE_LOCAL_EXECUTION: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://xgelazzdgluuenqkymox.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qwo_FImiLzCpE9f-iGYzrQ_0m4pntJk
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 27e3f3e70fc0a23c16d89beb8277c6adeea921fa
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert exact fixed application SHA
        run: test "$(git -C app rev-parse HEAD)" = 27e3f3e70fc0a23c16d89beb8277c6adeea921fa
      - name: Install app and pinned Chromium harness
        run: |
          cd app
          npm ci
          cd ../harness/smoke/notes
          npm init -y
          npm install --save-exact @playwright/test@1.56.1 @supabase/supabase-js@2.112.0
          npx playwright install --with-deps chromium
      - name: Build exact SHA locally with Staging public config
        working-directory: app
        run: npm run build -- --webpack
      - name: Create temporary Staging fixtures
        working-directory: harness/smoke/notes
        env:
          HAPPYDATE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.HAPPYDATE_STAGING_SERVICE_ROLE_KEY }}
        run: node setup.mjs
      - name: Run Notes Chromium smoke (real pointer/touch, no force)
        working-directory: harness/smoke/notes
        env:
          HAPPYDATE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.HAPPYDATE_STAGING_SERVICE_ROLE_KEY }}
        run: |
          cd ../../../app
          env -u HAPPYDATE_STAGING_SERVICE_ROLE_KEY npm start > "$RUNNER_TEMP/happydate-notes-next.log" 2>&1 &
          cd ../harness/smoke/notes
          npx playwright test notes.spec.mjs --workers=1 --reporter=line
      - name: Always remove and verify all run-owned fixtures
        if: ${{ always() }}
        working-directory: harness/smoke/notes
        env:
          HAPPYDATE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.HAPPYDATE_STAGING_SERVICE_ROLE_KEY }}
        run: if test -f "$RUNNER_TEMP/happydate-notes-state.json"; then node cleanup.mjs; fi
      - name: Record exact Notes scope
        if: ${{ always() }}
        run: |
          echo 'Notes-only smoke: fixed app SHA 27e3f3e70fc0a23c16d89beb8277c6adeea921fa; Linux Chromium local build with HappyDate Staging; Media job skipped for this Notes commit; no Production, bypass or Deployment Protection changes.' >> "$GITHUB_STEP_SUMMARY"
