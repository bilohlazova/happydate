name: HappyDate quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Strict complete dependency audit
        shell: bash
        run: |
          if npm audit --audit-level=low --json > audit-full.json; then
            cat audit-full.json
          else
            cat audit-full.json
            exit 1
          fi
      - name: Production dependency audit (independent evidence)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          if npm audit --omit=dev --audit-level=low --json > audit-production.json; then
            cat audit-production.json
          else
            cat audit-production.json
            exit 1
          fi
      - name: Preserve dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: audit-*.json
          if-no-files-found: warn
          retention-days: 7

  web-quality:
    name: Application quality / build / HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, typecheck and test
        run: npm run verify

      - name: Build optimized application
        run: npm run build -- --webpack

      - name: Exercise production HTTP runtime
        run: npm run smoke:production

  database-security:
    name: Database security / RLS isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      RUN_LOCAL_SUPABASE_RLS_TESTS: "1"
      LOCAL_SUPABASE_DB_CONTAINER: supabase_db_happydate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start an isolated local Supabase database and replay migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase start --exclude studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime,realtime,storage-api,postgrest,postgres-meta,kong,gotrue
          docker inspect "$LOCAL_SUPABASE_DB_CONTAINER" >/dev/null
          docker exec "$LOCAL_SUPABASE_DB_CONTAINER" pg_isready -U postgres -d postgres

      - name: Verify complete ordered migration replay
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sed 's#.*/##' | sort | sed 's/_.*//' > /tmp/expected-migrations
          docker exec "$LOCAL_SUPABASE_DB_CONTAINER" psql -U postgres -d postgres -At -c \
            "select version from supabase_migrations.schema_migrations order by version" > /tmp/applied-migrations
          diff -u /tmp/expected-migrations /tmp/applied-migrations

      - name: Run RLS and onboarding survey behavioral tests
        shell: bash
        run: |
          set -euo pipefail
          test "${RUN_LOCAL_SUPABASE_RLS_TESTS:-}" = "1"
          node --test tests/local-rls-owner-isolation.test.mjs

      - name: Stop temporary Supabase stack
        if: always()
        shell: bash
        run: supabase stop --no-backup || true

  redis-session-security:
    name: Redis hosted session / atomic lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.2.3-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Execute real Redis Lua and REST contract bridge
        env:
          LOCAL_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: node --test tests/hosted-session-redis.integration.mjs

  android-debug:
    name: Android debug shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install locked dependencies
        run: npm ci

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Compile Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  ios-simulator:
    name: iOS Simulator shell
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Synchronize Capacitor iOS
        run: npx cap sync ios

      - name: Compile unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

  release-quality-gate:
    # Preserve the existing required-check context while diagnostics run independently.
    name: Verify, build and runtime smoke
    if: always()
    needs: [dependency-security, web-quality, database-security, redis-session-security, android-debug, ios-simulator]
    runs-on: ubuntu-latest
    steps:
      - name: Require every diagnostic gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node - <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          let failed = false;
          const required = ['dependency-security', 'web-quality', 'database-security', 'redis-session-security', 'android-debug', 'ios-simulator'];
          for (const name of required) {
            const job = jobs[name] ?? {result: 'missing'};
            console.log(`${name}: ${job.result}`);
            if (job.result !== 'success') failed = true;
          }
          if (failed) process.exit(1);
          JS
